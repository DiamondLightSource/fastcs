- type: tickit.devices.source.Source
  name: source
  inputs: {}
  value: 42.0

- type: fastcs.demo.simulation.device.TempController
  name: tempcont_main
  inputs:
    flux:
      component: source
      port: value
  num_ramp_controllers: 4
  default_start: 10
  default_end: 50
  port: 25565

- type: fastcs.demo.simulation.device.TempController
  name: tempcont_aux
  inputs:
    flux:
      component: source
      port: value
  num_ramp_controllers: 2
  default_start: 5
  default_end: 30
  port: 25566

- type: tickit.devices.sink.Sink
  name: sink_main
  inputs:
    flux:
      component: tempcont_main
      port: flux

- type: tickit.devices.sink.Sink
  name: sink_aux
  inputs:
    flux:
      component: tempcont_aux
      port: flux
