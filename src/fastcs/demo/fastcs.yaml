# yaml-language-server: $schema=schema.json
controllers:
  - id: MAIN
    type: fastcs.TemperatureController
    connections:
      temperature:
        settings:
          ip: "localhost"
          port: 25565
        reconnect_attempts: 5
        reconnect_period: 2.0
    num_ramp_controllers: 4
  - id: AUX
    type: fastcs.TemperatureController
    connections:
      temperature:
        settings:
          ip: "localhost"
          port: 25566
    num_ramp_controllers: 2
transport:
  - graphql:
      host: localhost
      port: 8083
      log_level: info
  - epicsca: {}
    gui:
      title: Temperature Controller Demo
      output_dir: .
